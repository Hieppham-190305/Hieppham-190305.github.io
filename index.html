<!DOCTYPE html>
<html lang="vi">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title> Happy Birthday </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="Shortcut Icon" href="https://i.pinimg.com/236x/a5/20/de/a520deb545fea9b62776e6bea5d77928.jpg"
        type="image/x-icon" />
    <style>
        * { box-sizing: border-box; }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", Tahoma, "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
            background: #120e0d;
            color: #fff4ba;
            font-size: 18px;
            line-height: 2;
            letter-spacing: 1.2px;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        a {
            color: #ffee55;
        }

        /* 1. Nền web: Tăng độ tương phản gradient giúp các chi tiết phát sáng rõ hơn */
        .body--ready {
            background: linear-gradient(180deg, #e69d24 0%, #2a1f1d 60%, #120e0d 100%);
        }

        .canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* 2. Ảnh Avatar: Tăng độ rộng bóng đổ (glow) cực mạnh & đa tầng */
        img#logo {
            width: clamp(64px, 16vmin, 128px);
            height: clamp(64px, 16vmin, 128px);
            object-fit: cover;
            border-radius: 200px;
            border: 3px solid #ffee55;
            box-shadow: 0 0 25px #ffcc00,
                0 0 50px rgba(255, 204, 0, 0.6),
                0 0 80px rgba(255, 170, 0, 0.4);
            opacity: 1;
            display: block;
            margin: 0 auto;
            transition: all 0.8s ease-in-out;
        }

        /* 3. Hiệu ứng Hover Avatar: Phát sáng rực rỡ khi di chuột vào */
        #logo:hover {
            box-shadow: 0 0 30px #ffffff,
                0 0 60px #ffee00,
                0 0 100px #ff9900;
            transform: rotate(360deg) scale(1.05);
        }

        .cs {
            position: fixed;
            z-index: 1;
            top: max(16px, env(safe-area-inset-top));
            left: 0;
            width: 100%;
            text-align: center;
        }

        /* 4. Chữ đếm ngày: Thêm bóng chữ tỏa sáng dạ quang */
        .text {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 1;
            margin: 0;
            padding: 0 16px;
            font-size: clamp(14px, 2.5vmin, 18px);
            line-height: 1.8;
            overflow-wrap: anywhere;
            text-align: center;
            width: 100%;
            font-weight: bold;
            color: #fff4ba !important;
            text-shadow: 0 0 10px #ffcc00,
                0 0 20px rgba(255, 150, 0, 0.8);
        }

        .text-right {
            position: fixed;
            bottom: 50px;
            text-align: right;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>

    <script>
        var S = {
            init: function () {
                S.Drawing.init('.canvas');
                document.body.classList.add('body--ready');
                S.UI.simulate("Chúc mừng|Sinh nhật|Phan Võ Minh Thư|#countdown 3|Chúc Thư|Luôn vui vẻ|Tài sắc vẹn toàn|và|Sớm có bằng lái|nhaaaa|✨🎂✨ ");
                S.Drawing.loop(function () {
                    S.Shape.render();
                });
            }
        };
        S.Drawing = (function () {
            var canvas,
                context,
                renderFn,
                area = { w: 0, h: 0 },
                resizeFrame,
                requestFrame = window.requestAnimationFrame ||
                    window.webkitRequestAnimationFrame ||
                    window.mozRequestAnimationFrame ||
                    window.oRequestAnimationFrame ||
                    window.msRequestAnimationFrame ||
                    function (callback) {
                        window.setTimeout(callback, 1000 / 60);
                    };
            return {
                init: function (el) {
                    canvas = document.querySelector(el);
                    context = canvas.getContext('2d');
                    this.adjustCanvas();
                    window.addEventListener('resize', function () {
                        cancelAnimationFrame(resizeFrame);
                        resizeFrame = requestAnimationFrame(function () {
                            S.Drawing.adjustCanvas();
                            S.ShapeBuilder.refresh();
                        });
                    });
                },
                loop: function (fn) {
                    renderFn = !renderFn ? fn : renderFn;
                    this.clearFrame();
                    renderFn();
                    requestFrame.call(window, this.loop.bind(this));
                },
                adjustCanvas: function () {
                    var bounds = canvas.getBoundingClientRect(),
                        ratio = Math.min(window.devicePixelRatio || 1, 2);
                    area = { w: bounds.width, h: bounds.height };
                    canvas.width = Math.round(area.w * ratio);
                    canvas.height = Math.round(area.h * ratio);
                    context.setTransform(ratio, 0, 0, ratio, 0, 0);
                },
                clearFrame: function () {
                    context.clearRect(0, 0, area.w, area.h);
                },
                getArea: function () {
                    return area;
                },
                getContentArea: function () {
                    var avatar = document.querySelector('.cs').getBoundingClientRect(),
                        footer = document.querySelector('.text').getBoundingClientRect(),
                        top = avatar.bottom + 24,
                        bottom = Math.max(top + 1, footer.top - 24);
                    return { x: 16, y: top, w: Math.max(1, area.w - 32), h: bottom - top };
                },
                drawCircle: function (p, c) {
                    context.fillStyle = c.render();
                    context.beginPath();
                    context.arc(p.x, p.y, p.z * S.ShapeBuilder.getGap() / 20, 0, 2 * Math.PI, true);
                    context.closePath();
                    context.fill();
                }
            };
        }());
        S.UI = (function () {
            var interval,
                currentAction,
                time,
                maxShapeSize = 30,
                sequence = [],
                cmd = '#';
            function formatTime(date) {
                var h = date.getHours(),
                    m = date.getMinutes(),
                    m = m < 10 ? '0' + m : m;
                return h + ':' + m;
            }
            function getValue(value) {
                return value && value.split(' ')[1];
            }
            function getAction(value) {
                value = value && value.split(' ')[0];
                return value && value[0] === cmd && value.substring(1);
            }
            function timedAction(fn, delay, max, reverse) {
                clearInterval(interval);
                currentAction = reverse ? max : 1;
                fn(currentAction);
                if (!max || (!reverse && currentAction < max) || (reverse && currentAction > 0)) {
                    interval = setInterval(function () {
                        currentAction = reverse ? currentAction - 1 : currentAction + 1;
                        fn(currentAction);
                        if ((!reverse && max && currentAction === max) || (reverse && currentAction === 0)) {
                            clearInterval(interval);
                        }
                    }, delay);
                }
            }
            function getActionDelay() {
                // Leave time for particles to settle, then hold the complete message for reading.
                var mobile = window.matchMedia('(max-width: 767px), (pointer: coarse)').matches;
                return mobile ? 5000 : 3000;
            }
            function performAction(value) {
                var action,
                    value,
                    current;
                sequence = typeof (value) === 'object' ? value : sequence.concat(value.split('|'));
                timedAction(function (index) {
                    current = sequence.shift();
                    action = getAction(current);
                    value = getValue(current);
                    switch (action) {
                        case 'countdown':
                            value = parseInt(value) || 10;
                            value = value > 0 ? value : 10;
                            timedAction(function (index) {
                                if (index === 0) {
                                    if (sequence.length === 0) {
                                        S.Shape.switchShape(S.ShapeBuilder.letter(''));
                                    } else {
                                        performAction(sequence);
                                    }
                                } else {
                                    S.Shape.switchShape(S.ShapeBuilder.letter(index), true);
                                }
                            }, 1600, value, true);
                            break;
                        case 'rectangle':
                            value = value && value.split('x');
                            value = (value && value.length === 2) ? value : [maxShapeSize, maxShapeSize / 2];
                            S.Shape.switchShape(S.ShapeBuilder.rectangle(Math.min(maxShapeSize, parseInt(value[0])), Math.min(maxShapeSize, parseInt(value[1]))));
                            break;
                        case 'circle':
                            value = parseInt(value) || maxShapeSize;
                            value = Math.min(value, maxShapeSize);
                            S.Shape.switchShape(S.ShapeBuilder.circle(value));
                            break;
                        case 'time':
                            var t = formatTime(new Date());
                            if (sequence.length > 0) {
                                S.Shape.switchShape(S.ShapeBuilder.letter(t));
                            } else {
                                timedAction(function () {
                                    t = formatTime(new Date());
                                    if (t !== time) {
                                        time = t;
                                        S.Shape.switchShape(S.ShapeBuilder.letter(time));
                                    }
                                }, 1000);
                            }
                            break;
                        default:
                            S.Shape.switchShape(S.ShapeBuilder.letter(current[0] === cmd ? 'HacPai' : current));
                    }
                }, getActionDelay(), sequence.length);
            }
            return {
                simulate: function (action) {
                    performAction(action);
                }
            };
        }());
        S.Point = function (args) {
            this.x = args.x;
            this.y = args.y;
            this.z = args.z;
            this.a = args.a;
            this.h = args.h;
        };
        S.Color = function (r, g, b, a) {
            this.r = r;
            this.g = g;
            this.b = b;
            this.a = a;
        };
        S.Color.prototype = {
            render: function () {
                return 'rgba(' + this.r + ',' + +this.g + ',' + this.b + ',' + this.a + ')';
            }
        };
        S.Dot = function (x, y) {
            this.p = new S.Point({
                x: x,
                y: y,
                z: 5,
                a: 1,
                h: 0
            });
            this.e = 0.07;
            this.s = true;
            this.c = new S.Color(255, 255, 255, this.p.a);
            this.t = this.clone();
            this.q = [];
        };
        S.Dot.prototype = {
            clone: function () {
                return new S.Point({
                    x: this.p.x,
                    y: this.p.y,
                    z: this.p.z,
                    a: this.p.a,
                    h: this.p.h
                });
            },
            _draw: function () {
                this.c.a = this.p.a;
                S.Drawing.drawCircle(this.p, this.c);
            },
            _moveTowards: function (n) {
                var details = this.distanceTo(n, true),
                    dx = details[0],
                    dy = details[1],
                    d = details[2],
                    e = this.e * d;
                if (this.p.h === -1) {
                    this.p.x = n.x;
                    this.p.y = n.y;
                    return true;
                }
                if (d > 1) {
                    this.p.x -= ((dx / d) * e);
                    this.p.y -= ((dy / d) * e);
                } else {
                    if (this.p.h > 0) {
                        this.p.h--;
                    } else {
                        return true;
                    }
                }
                return false;
            },
            _update: function () {
                if (this._moveTowards(this.t)) {
                    var p = this.q.shift();
                    if (p) {
                        this.t.x = p.x === undefined ? this.p.x : p.x;
                        this.t.y = p.y === undefined ? this.p.y : p.y;
                        this.t.z = p.z || this.p.z;
                        this.t.a = p.a || this.p.a;
                        this.p.h = p.h || 0;
                    } else {
                        if (this.s) {
                            this.p.x -= Math.sin(Math.random() * 3.142);
                            this.p.y -= Math.sin(Math.random() * 3.142);
                        } else {
                            this.move(new S.Point({
                                x: this.p.x + (Math.random() * 50) - 25,
                                y: this.p.y + (Math.random() * 50) - 25
                            }));
                        }
                    }
                }
                var d = this.p.a - this.t.a;
                this.p.a = Math.max(0.1, this.p.a - (d * 0.05));
                d = this.p.z - this.t.z;
                this.p.z = Math.max(1, this.p.z - (d * 0.05));
            },
            distanceTo: function (n, details) {
                var dx = this.p.x - n.x,
                    dy = this.p.y - n.y,
                    d = Math.sqrt(dx * dx + dy * dy);
                return details ? [dx, dy, d] : d;
            },
            move: function (p, avoidStatic) {
                if (!avoidStatic || (avoidStatic && this.distanceTo(p) > 1)) {
                    this.q.push(p);
                }
            },
            render: function () {
                this._update();
                this._draw();
            }
        };
        S.ShapeBuilder = (function () {
            var gap = 13,
                shapeCanvas = document.createElement('canvas'),
                shapeContext = shapeCanvas.getContext('2d'),
                currentLetter = null,
                fontFamily = 'Avenir, Helvetica Neue, Helvetica, Arial, sans-serif';
            function fit() {
                var area = S.Drawing.getContentArea();
                gap = area.w < 600 ? 4 : 7;
                shapeCanvas.width = Math.max(1, Math.ceil(area.w));
                shapeCanvas.height = Math.max(1, Math.ceil(area.h));
                shapeContext.fillStyle = 'red';
                shapeContext.textBaseline = 'middle';
                shapeContext.textAlign = 'center';
            }
            function processCanvas() {
                var pixels = shapeContext.getImageData(0, 0, shapeCanvas.width, shapeCanvas.height).data,
                    dots = [], minX = shapeCanvas.width, minY = shapeCanvas.height,
                    maxX = 0, maxY = 0;
                for (var y = 0; y < shapeCanvas.height; y += gap) {
                    for (var x = 0; x < shapeCanvas.width; x += gap) {
                        if (pixels[(y * shapeCanvas.width + x) * 4 + 3] > 0) {
                            dots.push(new S.Point({ x: x, y: y }));
                            minX = Math.min(minX, x);
                            minY = Math.min(minY, y);
                            maxX = Math.max(maxX, x);
                            maxY = Math.max(maxY, y);
                        }
                    }
                }
                dots.forEach(function (dot) { dot.x -= minX; dot.y -= minY; });
                return { dots: dots, w: dots.length ? maxX - minX : 0, h: dots.length ? maxY - minY : 0 };
            }
            function setFontSize(s) {
                shapeContext.font = 'bold ' + s + 'px ' + fontFamily;
            }
            return {
                getGap: function () { return gap; },
                refresh: function () {
                    if (currentLetter !== null) {
                        S.Shape.switchShape(this.letter(currentLetter), true, true);
                    }
                },
                imageFile: function (url, callback) {
                    var image = new Image(),
                        a = S.Drawing.getArea();
                    image.onload = function () {
                        shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
                        shapeContext.drawImage(this, 0, 0, a.h * 0.6, a.h * 0.6);
                        callback(processCanvas());
                    };
                    image.onerror = function () {
                        callback(S.ShapeBuilder.letter('What?'));
                    };
                    image.src = url;
                },
                circle: function (d) {
                    var r = Math.max(0, d) / 2;
                    shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
                    shapeContext.beginPath();
                    shapeContext.arc(r * gap, r * gap, r * gap, 0, 2 * Math.PI, false);
                    shapeContext.fill();
                    shapeContext.closePath();
                    return processCanvas();
                },
                letter: function (l) {
                    currentLetter = String(l);
                    fit();
                    var words = currentLetter.trim().split(/\s+/),
                        lines = [], line = '', size = Math.min(220, shapeCanvas.height * 0.45),
                        maxWidth = shapeCanvas.width - 24,
                        maxHeight = shapeCanvas.height - 24;
                    // Reflow whole words first, then fit all lines including Vietnamese accents.
                    for (; size >= 8; size -= 1) {
                        setFontSize(size);
                        lines = []; line = '';
                        words.forEach(function (word) {
                            var next = line ? line + ' ' + word : word;
                            if (line && shapeContext.measureText(next).width > maxWidth) {
                                lines.push(line); line = word;
                            } else { line = next; }
                        });
                        lines.push(line);
                        if (lines.length <= (shapeCanvas.width < 600 ? 3 : 2) &&
                            lines.length * size * 1.35 <= maxHeight &&
                            lines.every(function (text) { return shapeContext.measureText(text).width <= maxWidth; })) {
                            break;
                        }
                    }
                    setFontSize(size);
                    shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
                    lines.forEach(function (text, i) {
                        shapeContext.fillText(text, shapeCanvas.width / 2,
                            shapeCanvas.height / 2 + (i - (lines.length - 1) / 2) * size * 1.35);
                    });
                    return processCanvas();
                },
                rectangle: function (w, h) {
                    var dots = [],
                        width = gap * w,
                        height = gap * h;
                    for (var y = 0; y < height; y += gap) {
                        for (var x = 0; x < width; x += gap) {
                            dots.push(new S.Point({
                                x: x,
                                y: y
                            }));
                        }
                    }
                    return { dots: dots, w: width, h: height };
                }
            };
        }());
        S.Shape = (function () {
            var dots = [],
                width = 0,
                height = 0,
                cx = 0,
                cy = 0;
            function compensate() {
                var a = S.Drawing.getArea();
                var content = S.Drawing.getContentArea();
                cx = content.x + (content.w - width) / 2;
                cy = content.y + (content.h - height) / 2;
            }
            return {
                shuffleIdle: function () {
                    var a = S.Drawing.getArea();
                    for (var d = 0; d < dots.length; d++) {
                        if (!dots[d].s) {
                            dots[d].move({
                                x: Math.random() * a.w,
                                y: Math.random() * a.h
                            });
                        }
                    }
                },
                switchShape: function (n, fast, reset) {
                    if (reset) {
                        dots.forEach(function (dot) { dot.q = []; dot.p.h = 0; });
                    }
                    var size,
                        a = S.Drawing.getArea();
                    width = n.w;
                    height = n.h;
                    compensate();
                    if (n.dots.length > dots.length) {
                        size = n.dots.length - dots.length;
                        for (var d = 1; d <= size; d++) {
                            dots.push(new S.Dot(a.w / 2, a.h / 2));
                        }
                    }
                    var d = 0,
                        i = 0;
                    while (n.dots.length > 0) {
                        i = Math.floor(Math.random() * n.dots.length);
                        dots[d].e = fast ? 0.25 : (dots[d].s ? 0.14 : 0.11);
                        if (dots[d].s) {
                            dots[d].move(new S.Point({
                                z: Math.random() * 20 + 10,
                                a: Math.random(),
                                h: 18
                            }));
                        } else {
                            dots[d].move(new S.Point({
                                z: Math.random() * 5 + 5,
                                h: fast ? 18 : 30
                            }));
                        }
                        dots[d].s = true;
                        dots[d].move(new S.Point({
                            x: n.dots[i].x + cx,
                            y: n.dots[i].y + cy,
                            a: 1,
                            z: 5,
                            h: 0
                        }));
                        n.dots = n.dots.slice(0, i).concat(n.dots.slice(i + 1));
                        d++;
                    }
                    for (var i = d; i < dots.length; i++) {
                        if (dots[i].s) {
                            dots[i].move(new S.Point({
                                z: Math.random() * 20 + 10,
                                a: Math.random(),
                                h: 20
                            }));
                            dots[i].s = false;
                            dots[i].e = 0.04;
                            dots[i].move(new S.Point({
                                x: Math.random() * a.w,
                                y: Math.random() * a.h,
                                a: 0.3,
                                z: Math.random() * 4,
                                h: 0
                            }));
                        }
                    }
                },
                render: function () {
                    for (var d = 0; d < dots.length; d++) {
                        dots[d].render();
                    }
                }
            };
        }());
        S.init();
    </script>
